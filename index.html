<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f5f7fb">
    <title>Paperplane PDF</title>
    <link rel="stylesheet" href="styles.css">
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script defer src="app.js"></script>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <a class="brand" href="#" aria-label="Paperplane PDF home">
          <span class="brand-mark" aria-hidden="true">P</span>
          <span>Paperplane <strong>PDF</strong></span>
        </a>
        <div class="document-name" id="document-name">No document open</div>
        <div class="top-actions">
          <button class="button button-secondary" id="open-button" type="button">Open PDF</button>
          <button class="button button-primary" id="save-button" type="button" disabled>Save a copy</button>
          <input class="visually-hidden" id="file-input" type="file" accept="application/pdf,.pdf">
        </div>
      </header>

      <section class="toolbar" aria-label="PDF tools">
        <div class="tool-group" aria-label="Editing mode">
          <button class="tool-button is-active" id="draw-tool" type="button" aria-pressed="true" title="Draw on the page">✎ <span>Draw</span></button>
          <button class="tool-button" id="text-tool" type="button" aria-pressed="false" title="Add typed text">T <span>Text</span></button>
        </div>
        <span class="toolbar-divider" aria-hidden="true"></span>
        <label class="control-label" for="ink-color">Ink</label>
        <input class="color-input" id="ink-color" type="color" value="#2864dc" aria-label="Ink color">
        <label class="control-label" for="ink-size">Size</label>
        <input id="ink-size" class="size-slider" type="range" min="1" max="12" value="3" aria-label="Pen size">
        <span class="toolbar-divider" aria-hidden="true"></span>
        <button class="tool-button compact" id="undo-button" type="button" disabled title="Undo the last mark">↶ <span>Undo</span></button>
        <div class="toolbar-spacer"></div>
        <button class="tool-button compact" id="zoom-out" type="button" disabled aria-label="Zoom out">−</button>
        <span class="zoom-value" id="zoom-value">100%</span>
        <button class="tool-button compact" id="zoom-in" type="button" disabled aria-label="Zoom in">+</button>
      </section>

      <section class="workspace">
        <aside class="page-rail" aria-label="Page navigation">
          <button class="nav-button" id="previous-page" type="button" disabled aria-label="Previous page">‹</button>
          <div class="page-count"><strong id="current-page">—</strong><span>/</span><span id="total-pages">—</span></div>
          <button class="nav-button" id="next-page" type="button" disabled aria-label="Next page">›</button>
        </aside>
        <section class="page-stage" id="page-stage" aria-label="PDF page">
          <div class="empty-state" id="empty-state">
            <div class="empty-icon" aria-hidden="true">▤</div>
            <h1>Your PDF, ready for a few notes.</h1>
            <p>Open a PDF to read, draw with your finger or pen, and add typed notes.</p>
            <button class="button button-primary" id="empty-open-button" type="button">Choose a PDF</button>
            <span class="empty-hint">Your document stays on this device.</span>
          </div>
          <div class="page-wrap" id="page-wrap" hidden>
            <canvas id="pdf-canvas" aria-label="PDF page contents"></canvas>
            <canvas id="annotation-canvas" aria-label="Drawing and text annotations"></canvas>
          </div>
        </section>
      </section>
      <footer class="statusbar">
        <span class="mode-hint" id="mode-hint">Draw mode · Use your finger, stylus, or mouse</span>
        <span class="status-message" id="status-message" role="status" aria-live="polite">Open a PDF to get started.</span>
      </footer>
    </main>
  </body>
</html>
